apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenda-veiculos-api
  labels:
    app: revenda-veiculos-api
    phase: fiap-soat-fase5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revenda-veiculos-api
  template:
    metadata:
      labels:
        app: revenda-veiculos-api
    spec:
      containers:
        - name: revenda-veiculos-api
          image: ghcr.io/gabrielnasczz/fiap-fase5:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: UsePostgres
              value: "true"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: revenda-veiculos-secrets
                  key: db-connection-string
            - name: Security__MasterEncryptionKey
              valueFrom:
                secretKeyRef:
                  name: revenda-veiculos-secrets
                  key: master-encryption-key
            - name: Security__HmacDeterministicKey
              valueFrom:
                secretKeyRef:
                  name: revenda-veiculos-secrets
                  key: hmac-deterministic-key
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: revenda-veiculos-service
spec:
  type: LoadBalancer
  selector:
    app: revenda-veiculos-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
